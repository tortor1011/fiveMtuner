name: CI — Validate Vehicle Metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-meta:
    name: Lint .meta / .xml files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libxml2-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils

      - name: Validate XML / META syntax
        run: |
          echo "::group::Discovering .meta and .xml files"
          files=$(find . -type f \( -name '*.meta' -o -name '*.xml' \) | sort)

          if [ -z "$files" ]; then
            echo "No .meta or .xml files found — skipping validation."
            exit 0
          fi

          echo "$files"
          echo "::endgroup::"

          errors=0
          for f in $files; do
            echo "Validating: $f"
            if ! xmllint --noout "$f" 2>&1; then
              echo "::error file=$f::XML syntax error detected in $f"
              errors=$((errors + 1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "::error::$errors file(s) failed XML validation."
            exit 1
          fi

          echo ""
          echo "All files passed XML validation."
