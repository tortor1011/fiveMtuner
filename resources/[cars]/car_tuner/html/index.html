<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Handling Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Prompt:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- ── Main Panel ────────────────────────────────────────────────────── -->
    <div id="tuner-container" class="tuner-container hidden">
        <div class="tuner-panel">

            <!-- Header -->
            <header class="tuner-header">
                <div class="header-left">
                    <div class="header-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94
                                   7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>Handling Editor</h1>
                        <span class="header-sub">เครื่องมือปรับแต่ง Handling ยานพาหนะ (Real-time)</span>
                    </div>
                </div>
                <span class="live-badge">● LIVE</span>
            </header>

            <!-- Tab Navigation (generated by JS) -->
            <nav class="tab-nav" id="tab-nav"></nav>

            <!-- Tab Content (generated by JS) -->
            <main class="tab-content" id="tab-content"></main>

            <!-- Action Bar -->
            <footer class="action-bar">
                <button id="btn-save" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    <span id="btn-save-label">บันทึกค่าจูน (Save Tuning)</span>
                </button>
                <button id="btn-close" class="btn btn-ghost">ปิดหน้าต่าง</button>
            </footer>
        </div>
    </div>

    <!-- Floating Cyber Glassmorphism Tooltip -->
    <div id="tuner-tooltip" class="tuner-tooltip hidden">
        <div class="tooltip-header">
            <span class="tooltip-title" id="tooltip-title"></span>
            <code class="tooltip-tag" id="tooltip-tag"></code>
        </div>
        <div class="tooltip-desc" id="tooltip-desc"></div>
        <div class="tooltip-effects" id="tooltip-effects">
            <div class="tooltip-effect effect-up" id="tooltip-up-row">
                <span class="effect-icon">▲</span>
                <div class="effect-text">
                    <strong>ปรับเพิ่ม:</strong> <span id="tooltip-up-text"></span>
                </div>
            </div>
            <div class="tooltip-effect effect-down" id="tooltip-down-row">
                <span class="effect-icon">▼</span>
                <div class="effect-text">
                    <strong>ปรับลด:</strong> <span id="tooltip-down-text"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>

</html>
